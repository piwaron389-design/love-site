<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل مدیریت - پاسخ عشق</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #0a0f2a, #1a1a3a);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .admin-container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(15px);
            border-radius: 50px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.2);
        }
        h1 {
            color: #ff88aa;
            margin-bottom: 30px;
        }
        .lock-icon {
            font-size: 60px;
            color: #ff88aa;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 15px;
            margin: 15px 0;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            text-align: center;
            font-family: 'Cairo', sans-serif;
            background: rgba(255,255,255,0.2);
            color: white;
        }
        input::placeholder {
            color: rgba(255,255,255,0.6);
        }
        button {
            background: linear-gradient(135deg, #ff3366, #ff6699);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.1rem;
            cursor: pointer;
            width: 100%;
            font-family: 'Cairo', sans-serif;
        }
        .error {
            color: #ff8888;
            margin-top: 15px;
        }
        .answer-box {
            background: rgba(0,0,0,0.5);
            border-radius: 40px;
            padding: 25px;
            margin-top: 20px;
        }
        .answer-big {
            font-size: 2rem;
            font-weight: bold;
            margin: 15px 0;
        }
        .answer-yes {
            color: #88ff88;
        }
        .answer-no {
            color: #ff8888;
        }
        .info {
            margin-top: 15px;
            font-size: 0.9rem;
            color: #aaa;
        }
        .refresh-btn {
            background: rgba(100,100,150,0.5);
            margin-top: 15px;
        }
        .hidden {
            display: none;
        }
        .heart-icon {
            font-size: 30px;
            animation: heartbeat 1s infinite;
            display: inline-block;
        }
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
    </style>
</head>
<body>
<div class="admin-container" id="loginBox">
    <div class="lock-icon"><i class="fas fa-lock"></i></div>
    <h1>پنل مدیریت</h1>
    <input type="password" id="adminPassword" placeholder="رمز عبور را وارد کن...">
    <button id="loginBtn"><i class="fas fa-key"></i> ورود</button>
    <div id="loginError" class="error"></div>
</div>

<div class="admin-container hidden" id="panelBox">
    <div class="heart-icon"><i class="fas fa-heart"></i></div>
    <h1>💌 پاسخ عشق من</h1>
    <div class="answer-box" id="answerDisplay">
        <div id="answerText">در حال بارگذاری...</div>
        <div id="answerTime" class="info"></div>
        <div id="answerIp" class="info"></div>
    </div>
    <button id="refreshBtn" class="refresh-btn"><i class="fas fa-sync-alt"></i> بروزرسانی</button>
    <button id="logoutBtn" style="margin-top: 15px; background: #666;"><i class="fas fa-sign-out-alt"></i> خروج</button>
</div>

<script>
    // ==================== تنظیمات JSONBin (همون مقادیر فایل index.html) ====================
    const BIN_ID = "YOUR_BIN_ID_HERE";     // <-- جایگزین کن با همون Bin ID قبلی
    const API_KEY = "YOUR_API_KEY_HERE";   // <-- جایگزین کن با همون API Key قبلی
    const ADMIN_PASSWORD = "love2025";      // <-- رمز دلخواه خودت (تغییر بده)
    
    async function fetchAnswer() {
        try {
            const response = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { 'X-Master-Key': API_KEY }
            });
            const data = await response.json();
            return data.record;
        } catch(e) {
            console.error(e);
            return { answer: null, answered: false, timestamp: null, ip: null };
        }
    }
    
    async function updateDisplay() {
        const data = await fetchAnswer();
        const answerDiv = document.getElementById('answerText');
        const timeDiv = document.getElementById('answerTime');
        const ipDiv = document.getElementById('answerIp');
        
        if (data.answered && data.answer) {
            if (data.answer === 'بله') {
                answerDiv.innerHTML = `<span style="font-size: 2rem;">✅</span><br><span class="answer-yes" style="font-size: 2rem;">بله، دوستم دارد! ❤️</span><br><span style="font-size: 1.2rem;">😭 عاشقتم عزیزم 😭</span>`;
            } else {
                answerDiv.innerHTML = `<span style="font-size: 2rem;">❌</span><br><span class="answer-no" style="font-size: 2rem;">نه جواب داده 😅</span><br><span style="font-size: 1rem;">(احتمالاً شوخی کرده، بازم دوستت داره ❤️)</span>`;
            }
            timeDiv.innerHTML = `<i class="fas fa-clock"></i> زمان پاسخ: ${data.timestamp || 'نامشخص'}`;
            ipDiv.innerHTML = `<i class="fas fa-globe"></i> IP: ${data.ip || 'نامشخص'}`;
        } else {
            answerDiv.innerHTML = `<span style="font-size: 2rem;">⏳</span><br>هنوز پاسخی ثبت نشده<br><span style="font-size: 1rem;">منتظر جواب عشقم هستم...</span>`;
            timeDiv.innerHTML = '';
            ipDiv.innerHTML = '';
        }
    }
    
    // مدیریت لاگین
    document.getElementById('loginBtn').onclick = () => {
        const pass = document.getElementById('adminPassword').value;
        if (pass === ADMIN_PASSWORD) {
            document.getElementById('loginBox').classList.add('hidden');
            document.getElementById('panelBox').classList.remove('hidden');
            updateDisplay();
        } else {
            document.getElementById('loginError').innerHTML = '❌ رمز اشتباه است!';
        }
    };
    
    document.getElementById('refreshBtn').onclick = () => {
        updateDisplay();
    };
    
    document.getElementById('logoutBtn').onclick = () => {
        document.getElementById('panelBox').classList.add('hidden');
        document.getElementById('loginBox').classList.remove('hidden');
        document.getElementById('adminPassword').value = '';
        document.getElementById('loginError').innerHTML = '';
    };
    
    // Enter key support
    document.getElementById('adminPassword').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') document.getElementById('loginBtn').click();
    });
</script>
</body>
</html>
